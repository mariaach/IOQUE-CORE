services:
  postgres:
    image: postgres:16-alpine
    container_name: ioque_postgres
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    expose:
      - "5432"
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    command: >
      postgres
      -c shared_buffers=32MB
      -c effective_cache_size=128MB
      -c work_mem=4MB
      -c maintenance_work_mem=32MB
      -c random_page_cost=4.0
      -c synchronous_commit=off

  django:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: ioque_django
    restart: unless-stopped
    expose:
      - "8000"
    volumes:
      - media_volume:/app/mediafiles
      - static_volume:/app/staticfiles
      #- /home/bayron/Documents/PROYECTOS/IOQUE/Recursos:/Recursos:ro
      - /home/bayron/Documents/PROYECTOS/IOQUE/Recursos:/Recursos:ro
      #- /home/bayron/Documents/PROYECTOS/IOQUE/Recursos:/Recursos:ro
    entrypoint:
      - /app/docker/entrypoint.sh
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      NEQUI_CLIENT_ID: ${NEQUI_CLIENT_ID}
      NEQUI_CLIENT_SECRET: ${NEQUI_CLIENT_SECRET}
      NEQUI_API_KEY: ${NEQUI_API_KEY}
      NEQUI_MERCHANT_CODE: ${NEQUI_MERCHANT_CODE}
      NEQUI_AUTH_URI: ${NEQUI_AUTH_URI}
      NEQUI_API_BASE_PATH: ${NEQUI_API_BASE_PATH}
      NEQUI_NOTIFICATION_URL: ${NEQUI_NOTIFICATION_URL}
    depends_on:
      postgres:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    container_name: ioque_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - static_volume:/app/staticfiles:ro
      - media_volume:/app/mediafiles:ro
    depends_on:
      - django

  backup:
    image: postgres:16-alpine
    container_name: ioque_backup
    profiles:
      - backup
    volumes:
      - ./backups:/backups
    entrypoint:
      - sh
      - -c
      - |
        pg_dump -h postgres -U $${POSTGRES_USER} -d $${POSTGRES_DB} \
          | gzip > /backups/ioque_$$(date +%Y%m%d_%H%M%S).sql.gz
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  media_volume:
  static_volume:
