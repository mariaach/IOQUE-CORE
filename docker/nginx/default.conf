upstream django {
    server django:8000;
    keepalive 32;
}

gzip on;
gzip_types application/json text/css text/javascript text/plain image/svg+xml;
gzip_min_length 1000;
gzip_vary on;
gzip_comp_level 4;

server_tokens off;

limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;

proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=api_cache:10m max_size=100m inactive=60m use_temp_path=off;

# Servidor HTTP para desarrollo (localhost)
server {
    listen 80;
    #server_name localhost ioqueartesanias.com www.ioqueartesanias.com;
    #server_name 132.145.204.8
    server_name _;

    client_max_body_size 50M;
    client_body_timeout 30s;
    client_header_timeout 10s;
    keepalive_timeout 30s;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    aio on;
    directio 512k;
    output_buffers 2 32k;
    postpone_output 1460;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header X-XSS-Protection "0" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' https://media.ioqueartesanias.com data:; font-src 'self'; connect-src 'self'; frame-ancestors 'self';" always;

    location = /favicon.ico {
        alias /app/staticfiles/img/logoicon.png;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location /media/ {
        alias /app/mediafiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location /api/ {
        proxy_cache api_cache;
        proxy_cache_key "$scheme$request_method$host$request_uri";
        proxy_cache_valid 200 30m;
        proxy_cache_use_stale error timeout updating;
        add_header X-Cache-Status $upstream_cache_status;

        proxy_pass http://django;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_buffer_size 8k;
        proxy_buffers 8 8k;

        limit_req zone=api burst=50 nodelay;
    }

    location / {
        proxy_pass http://django;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_redirect off;
        proxy_buffer_size 8k;
        proxy_buffers 8 8k;
    }
}
# NOTA: Los bloques de producción (redirect HTTPS y servidor SSL) se comentan
# para desarrollo local. Para producción, descomentar y proveer certificados.
